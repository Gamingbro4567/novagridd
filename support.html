<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVAGRID — Support</title><meta name="description" content="NOVAGRID hosting platform">
<link rel="stylesheet" href="assets/style.css"></head><body>
<header><div class="container header-inner">
<a class="logo" href="index.html">NOVA<span>GRID</span></a>
<button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="siteMenu"><span></span><span></span><span></span></button>
<div class="nav-menu" id="siteMenu"><nav><a href="index.html">Home</a><a href="plans.html">Hosting Plans</a><a href="status.html">Status</a><a href="support.html">Support</a><a href="feedback.html">Feedback</a><a href="faq.html">FAQ</a></nav><div class="actions"><a class="btn ghost" href="login.html">Login</a><a class="btn primary" href="signup.html">Sign Up</a></div></div>
</div></header>
<main class="page"><div class="container"><div class="form-wrap card"><div class="section-title"><h2>Open a Support Ticket</h2><p>Send your issue to the NOVAGRID support team.</p></div>
<form onsubmit="demo(event,'Ticket form submitted in demo mode. Connect a database/backend to store real tickets.');"><label>Name</label><input required placeholder="Your name"><label>Email</label><input type="email" required placeholder="you@example.com"><label>Subject</label><input required placeholder="What do you need help with?"><label>Message</label><textarea required placeholder="Describe your issue"></textarea><button class="btn primary full" type="submit">Submit Ticket</button></form></div></div></main>
<footer><div class="container footer-inner"><span>© 2026 NOVAGRID</span><span>Hosting • Support • Status</span></div></footer>
<script>
const toggle=document.getElementById('menuToggle'),menu=document.getElementById('siteMenu');
toggle.addEventListener('click',()=>{const open=menu.classList.toggle('open');toggle.setAttribute('aria-expanded',open);toggle.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');});
menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation menu')}));
window.addEventListener('resize',()=>{if(window.innerWidth>900){menu.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
function demo(e,msg){e.preventDefault();alert(msg)}
</script></body></html>
